# DYO AE Agent Dashboard - Nginx server block
#
# Target hostname: ae-agent.dyocourses.com
# Proxies all traffic to the existing production `dyo-web` PM2 process
# (Next.js, deploy/pm2/ecosystem.config.cjs), which stays bound to
# 127.0.0.1:4100 - this is the ONLY thing on the machine that gets this
# public hostname. Port 4100 itself is never exposed directly; it is only
# ever reached through this Nginx proxy.
#
# dyo-web already enforces authentication end to end (middleware.ts
# redirects any unauthenticated request to /login before this Nginx layer
# is even relevant) - this file adds no auth logic itself and must not
# remove any.
#
# PREPARED 2026-08-25. NOT YET APPLIED to /etc/nginx/sites-available - this
# session has no sudo access to copy it there, symlink it into
# sites-enabled, run `nginx -t`, or reload Nginx. Apply sequence once
# access is available, mirroring how worker-api.dyocourses.com and
# dashboard.dyocourses.com were both bootstrapped (see their own installed
# configs' history):
#   1. `sudo cp deploy/nginx/ae-agent.dyocourses.com.conf
#        /etc/nginx/sites-available/ae-agent.dyocourses.com`
#   2. `sudo ln -s /etc/nginx/sites-available/ae-agent.dyocourses.com
#        /etc/nginx/sites-enabled/ae-agent.dyocourses.com`
#   3. `sudo nginx -t` - only reload if this passes.
#   4. `sudo systemctl reload nginx` (or `nginx -s reload`).
#   5. Once DNS for ae-agent.dyocourses.com resolves to this server's real
#      public IP (169.58.48.14 as of this check - confirmed via
#      `curl -s -4 ifconfig.me` on this host), THEN and only then:
#      `sudo certbot --nginx -d ae-agent.dyocourses.com` - this both
#      obtains the certificate and rewrites this file in place to add the
#      listen 443/ssl_certificate lines and the HTTP->HTTPS redirect block,
#      exactly as it already did for worker-api.dyocourses.com and
#      dashboard.dyocourses.com. Do not run certbot before DNS resolves,
#      and do not run it repeatedly - one successful run is enough.
#
# This file changes nothing about any other Nginx site. No existing server
# block is touched by installing this one.

map $http_upgrade $ae_agent_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ae-agent.dyocourses.com;

    # Real dashboard traffic over plain HTTP for now (DNS does not resolve
    # yet, so there is no certificate to redirect to) - certbot upgrades
    # this in place to HTTPS-with-redirect once DNS is live, per the
    # header comment above. Never a fake/self-signed certificate here.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js itself doesn't require a WebSocket upgrade in production
        # (dashboard status is plain polled fetch, not a socket), but this
        # is forwarded correctly regardless in case a future route needs
        # it - falls through to a normal HTTP proxy when no Upgrade header
        # is sent, which is every request today.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ae_agent_connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # Sane, bounded timeouts - generous enough for a slow dashboard
        # page load, never "forever".
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
