# DYO AE Agent Dashboard - Nginx server block
#
# Target hostname: ae-agent.dyocourses.com
# Proxies all traffic to the existing production `dyo-web` PM2 process
# (Next.js, deploy/pm2/ecosystem.config.cjs), which stays bound to
# 127.0.0.1:4100 - this is the ONLY thing on the machine that gets this
# public hostname. Port 4100 itself is never exposed directly; it is only
# ever reached through this Nginx proxy.
#
# dyo-web already enforces authentication end to end (middleware.ts
# redirects any unauthenticated request to /login before this Nginx layer
# is even relevant) - this file adds no auth logic itself and must not
# remove any.
#
# APPLIED (this file was installed to /etc/nginx/sites-available and
# certbot has since added its own listen 443/ssl_certificate lines and the
# HTTP->HTTPS redirect block to the LIVE file in place - this tracked copy
# predates that and is not byte-for-byte identical to production for that
# reason alone; that drift is expected and not something to "fix" by
# overwriting the live file wholesale).
#
# 2026-08-30: added a targeted regex location for
# /api/projects/:projectId/mapping-suggestions/generate (see the location
# block below) with a longer proxy_read_timeout/proxy_send_timeout - a
# real Anthropic-backed generate call for a project needing AI help on
# most/all of its scenes legitimately takes ~60-61 seconds end to end
# (confirmed via dyo-api's own responseTime logs: 61353ms and 60652ms,
# both real 200s), which is at or just past the general location's 60s
# proxy_read_timeout - producing a genuine 504 at nginx even though the
# app itself succeeded. This session has no sudo access to apply this
# change to the live file directly - see the exact manual steps this
# fix's own report gives for applying just this diff by hand.
#
# This file changes nothing about any other Nginx site. No existing server
# block is touched by installing this one.

map $http_upgrade $ae_agent_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ae-agent.dyocourses.com;

    # Real dashboard traffic over plain HTTP for now (DNS does not resolve
    # yet, so there is no certificate to redirect to) - certbot upgrades
    # this in place to HTTPS-with-redirect once DNS is live, per the
    # header comment above. Never a fake/self-signed certificate here.
    #
    # 210m - deliberately just above the API's own ASSET_MAX_UPLOAD_BYTES
    # default (200MB, see apps/api/src/env.ts). A real client asset upload
    # must never be rejected by Nginx before it ever reaches the app's own
    # typed 413 PayloadTooLargeError; if ASSET_MAX_UPLOAD_BYTES is ever
    # raised in .env, this must be raised to match (see the asset/work-map
    # phase's production-readiness audit for why these two limits must be
    # kept in lockstep).
    client_max_body_size 210m;

    # Real production bug, 2026-08-30: a real Anthropic-backed mapping-
    # suggestions generation legitimately takes ~60-61 seconds for a
    # project needing AI help on most/all of its scenes - just past this
    # server's general 60s proxy_read_timeout, producing a genuine 504
    # even though the app itself returns 200. A regex location (nginx
    # evaluates a matching regex location ahead of the general prefix
    # location below, regardless of file order) targets ONLY this one
    # dynamic-:projectId route with a longer, still-bounded timeout -
    # every other route keeps the normal 60s. 210s outlives the
    # application's own bounded 180s generate timeout (browser and Next
    # proxy - see projects-api-client.ts's GENERATE_SUGGESTIONS_TIMEOUT_MS)
    # so nginx never cuts the connection before the app's own timeout
    # would have, and its resulting error/response can still propagate
    # back to the browser instead of being replaced by a bare 504.
    location ~ ^/api/projects/[0-9a-fA-F-]+/mapping-suggestions/generate$ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ae_agent_connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 210s;
        proxy_read_timeout 210s;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js itself doesn't require a WebSocket upgrade in production
        # (dashboard status is plain polled fetch, not a socket), but this
        # is forwarded correctly regardless in case a future route needs
        # it - falls through to a normal HTTP proxy when no Upgrade header
        # is sent, which is every request today.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ae_agent_connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # Sane, bounded timeouts - generous enough for a slow dashboard
        # page load, never "forever".
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
