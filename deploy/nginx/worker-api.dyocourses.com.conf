# DYO Windows Worker API - Nginx server block
#
# Target hostname: worker-api.dyocourses.com
# Proxies exclusively to dyo-api, which stays bound to 127.0.0.1:4000 - this
# is the ONLY thing on the machine that gets a public hostname for it.
#
# DEPLOYED 2026-08-23 (Phase 4). This is a mirror of the live file at
# /etc/nginx/sites-available/worker-api.dyocourses.com (symlinked into
# sites-enabled), kept in the repo so the exact live config is reviewable
# and diffable going forward. It was installed via the same sequence the
# other 7 dyocourses.com sites use (all "managed by Certbot"):
#   1. A temporary HTTP-only stub (port 80, `return 404` body, no
#      ssl_certificate lines) was installed and reloaded so ACME HTTP-01
#      had a matching server_name to attach to.
#   2. `sudo certbot --nginx -d worker-api.dyocourses.com` obtained the
#      certificate and auto-added the listen 443/ssl_certificate lines and
#      the HTTP->HTTPS redirect block below (both "managed by Certbot").
#   3. This file's `location` blocks (the path allowlist) were installed
#      over certbot's placeholder body via `sudo tee`, then `nginx -t` and
#      `nginx -s reload` applied it.
#
# UPDATED (Phase 5 job dispatch): POST /jobs/claim and POST
# /jobs/:jobId/report are live in production - this repo copy had drifted
# out of sync with the live file (the earlier note here about pending sudo
# access was stale; the live file already had both blocks) and has now
# been reconciled to match exactly what is actually running.
#
# UPDATED (2026-09-04, stuck-job reconciliation root cause): GET
# /jobs/active (apps/api/src/routes/jobs.ts) was added for a freshly
# started Worker process to discover a job left non-terminal by a
# previous, crashed/killed worker process (see reconcile-abandoned-jobs.ts
# on the worker side) - but this allowlist was never updated for it, so
# every real request nginx received for this path was silently 404'd
# here, never even reaching dyo-api. Confirmed via dyo-api's own complete
# request log showing zero occurrences of this path, ever, across every
# worker restart/retry. Added below, same GET-only/proxy conventions as
# every other location.
#
# UPDATED (2026-09-07, live QA - the SAME class of gap as the /jobs/active
# note above): POST /jobs/:jobId/scene-evidence-preview
# (apps/api/src/routes/scene-evidence-preview-upload.ts, registered in
# app.ts, reachable and correct when hit directly against 127.0.0.1:4000)
# was never added to this allowlist either, so every real Worker upload
# attempt fell through to `location / { return 404; }` here and never
# reached dyo-api at all - confirmed via dyo-api's own request log
# showing zero occurrences of this exact path, ever, and via the Worker's
# own structured log showing a clean local file read (read-success)
# immediately followed by an http-failed 404. Added below, POST-only,
# mirroring the /report block's own proxy conventions exactly. A captured
# evidence-frame PNG is small (a few KB in practice - see that route's own
# doc comment) - 10m is a real, bounded cap, generously sized above that,
# never the shared 2GB render-artifact application-layer ceiling (which
# exists for actual rendered video uploads, not this).
#
# UPDATED (2026-09-08, live QA - the SAME class of gap as the /jobs/active
# and scene-evidence-preview notes above): GET
# /api/workers/:workerId/jobs/:jobId/assets/:assetId/file
# (apps/api/src/routes/worker-asset-download.ts, correctly registered in
# Fastify and reachable directly against 127.0.0.1:4000) was never added to
# this allowlist either, so every real Worker MAP_FOOTAGE asset download
# fell through to `location / { return 404; }` here and never reached
# dyo-api at all - confirmed via a real EXECUTE_FRAME job's own reported
# failureReason ("asset download failed: Unexpected API response (status
# 404)") during live QA. Added below, GET-only, mirroring the /jobs/active
# block's own proxy conventions exactly (a plain authenticated GET with no
# meaningful request body - no custom client_max_body_size override is
# needed here for the same reason none of register/heartbeat/jobs-claim/
# jobs-active needed one; nginx's client_max_body_size only bounds the
# REQUEST body, never the proxied response, so an image-sized response
# streams through unaffected regardless).
#
# UPDATED (2026-09-08, live QA - a full audit of the complete worker-
# authenticated API surface after the assets/file gap above, run
# specifically because that gap turned out to be the THIRD occurrence of
# this exact class of bug): four more real, correctly-registered Fastify
# routes were confirmed missing from this allowlist the same way -
# POST /jobs/:jobId/checkpoint (apps/api/src/routes/jobs.ts, mid-job
# durable progress reporting - confirmed missing via a real EXECUTE_FRAME
# job that completed its first real AE mutation, then failed with
# "checkpoint persistence failed... status 404" trying to durably record
# that fact), POST /jobs/:jobId/preview (routes/preview-upload.ts, the
# EXECUTE_FRAME first-frame preview upload), POST /jobs/:jobId/full-preview
# (routes/full-preview-upload.ts, the complete-preview video upload), and
# POST /jobs/:jobId/artifact (routes/render-artifact-upload.ts, the final
# rendered video upload). All four added below, same POST-only/proxy
# conventions as every block above. client_max_body_size sizing mirrors
# each route's own real, already-configured application-layer ceiling
# (app.ts's own maxUploadBytes wiring - never guessed):
#   - checkpoint carries a small JSON body only (no file part at all) -
#     the server-wide 1M default above already covers it generously, no
#     override needed, same reasoning as heartbeat/jobs-claim/jobs-active.
#   - preview uploads a single rendered frame image, application-layer
#     ceiling ASSET_MAX_UPLOAD_BYTES (200MB default) - given nginx's own
#     bound just needs to comfortably clear a real single-frame image
#     (the exact same real-world size class scene-evidence-preview's own
#     10m above already covers), 10m is used here too rather than
#     matching the full 200MB app ceiling verbatim - the app's own check
#     remains the real enforcement layer regardless.
#   - full-preview and artifact both upload a real rendered VIDEO,
#     application-layer ceiling RENDER_ARTIFACT_MAX_UPLOAD_BYTES (2GB
#     default) - nginx is set to match that same 2g here so it can never
#     become the FIRST, wrong-error-message rejection point for a
#     legitimate large video the application layer would otherwise accept.
#
# This file changes nothing about any other Nginx site. No existing server
# block was touched during deployment.

# Self-contained (not a shared/global map) so this file has no dependency on
# any other conf.d addition - deliberately named to avoid colliding if
# another site later adds its own websocket-upgrade map.
map $http_upgrade $worker_api_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name worker-api.dyocourses.com;

    # This host exists for exactly one purpose: letting the Windows worker
    # reach dyo-api's loopback-only port. No static files, no directory
    # listing, no other application is reachable through this hostname.
    #
    # Path allowlist, not a catch-all proxy: dyo-api also serves
    # GET /api/workers and GET /api/workers/:workerId (full fleet
    # inventory - names, statuses, capabilities, job IDs) with NO
    # authentication at the application layer today (see the Phase 4 STEP 3
    # security review in docs/AUDIT.md). Those are dashboard-management
    # reads the dashboard already gets via its own internal Next.js proxy
    # straight to 127.0.0.1:4000, loopback-only - the Windows worker itself
    # never calls them (apps/worker/src/infrastructure/api-client.ts only
    # calls POST /api/workers/register and POST /api/workers/:id/heartbeat).
    # They are deliberately NOT proxied here. If a real external consumer of
    # those GET endpoints ever exists, add real authentication to them in
    # apps/api first, then add an explicit location for them - do not widen
    # this to a catch-all `location /` to save effort.
    client_max_body_size 1M;

    location = /api/workers/register {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/heartbeat$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket upgrade support reserved for future worker
        # communication - falls through to a normal HTTP proxy when no
        # Upgrade header is sent, which is every heartbeat call today.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $worker_api_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Generous but bounded - a future long-lived/streaming heartbeat
        # connection shouldn't be cut at Nginx's 60s default, but this is
        # still a hard cap, not "forever".
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/claim$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/active$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except GET { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/[0-9a-fA-F-]+/report$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # A job result (e.g. a full template-manifest.json) can be larger
        # than the server-wide 1M default above - still a real, bounded
        # cap, not unlimited.
        client_max_body_size 5m;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/[0-9a-fA-F-]+/scene-evidence-preview$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # A captured evidence-frame PNG is small (a few KB in practice) -
        # generously bounded well above that, never the shared 2GB
        # render-artifact application-layer ceiling (real rendered video
        # uploads, not this).
        client_max_body_size 10m;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/[0-9a-fA-F-]+/assets/[0-9a-fA-F-]+/file$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except GET { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/[0-9a-fA-F-]+/checkpoint$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # A checkpoint body is a small JSON progress record, never a file -
        # the server-wide 1M default above already covers it generously.
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/[0-9a-fA-F-]+/preview$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # A single EXECUTE_FRAME preview frame (real still image) - same
        # real-world size class as scene-evidence-preview's own 10m above,
        # comfortably below the application layer's own 200MB
        # ASSET_MAX_UPLOAD_BYTES ceiling (the real enforcement point).
        client_max_body_size 10m;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/[0-9a-fA-F-]+/full-preview$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # A real complete-preview VIDEO, comparable in size to a real
        # render - matches the application layer's own
        # RENDER_ARTIFACT_MAX_UPLOAD_BYTES default (2GB) so nginx can never
        # become the first, wrong-error rejection point for a legitimate
        # upload the application layer would otherwise accept.
        client_max_body_size 2g;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/jobs/[0-9a-fA-F-]+/artifact$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # The final rendered output video - matches the application
        # layer's own RENDER_ARTIFACT_MAX_UPLOAD_BYTES default (2GB), same
        # reasoning as full-preview above.
        client_max_body_size 2g;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/worker-api.dyocourses.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/worker-api.dyocourses.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = worker-api.dyocourses.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name worker-api.dyocourses.com;
    return 404; # managed by Certbot
}
