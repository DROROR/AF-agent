# DYO Windows Worker API - Nginx server block
#
# Target hostname: worker-api.dyocourses.com
# Proxies exclusively to dyo-api, which stays bound to 127.0.0.1:4000 - this
# is the ONLY thing on the machine that gets a public hostname for it.
#
# DEPLOYED 2026-08-23 (Phase 4). This is a mirror of the live file at
# /etc/nginx/sites-available/worker-api.dyocourses.com (symlinked into
# sites-enabled), kept in the repo so the exact live config is reviewable
# and diffable going forward. It was installed via the same sequence the
# other 7 dyocourses.com sites use (all "managed by Certbot"):
#   1. A temporary HTTP-only stub (port 80, `return 404` body, no
#      ssl_certificate lines) was installed and reloaded so ACME HTTP-01
#      had a matching server_name to attach to.
#   2. `sudo certbot --nginx -d worker-api.dyocourses.com` obtained the
#      certificate and auto-added the listen 443/ssl_certificate lines and
#      the HTTP->HTTPS redirect block below (both "managed by Certbot").
#   3. This file's `location` blocks (the path allowlist) were installed
#      over certbot's placeholder body via `sudo tee`, then `nginx -t` and
#      `nginx -s reload` applied it.
#
# This file changes nothing about any other Nginx site. No existing server
# block was touched during deployment.

# Self-contained (not a shared/global map) so this file has no dependency on
# any other conf.d addition - deliberately named to avoid colliding if
# another site later adds its own websocket-upgrade map.
map $http_upgrade $worker_api_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name worker-api.dyocourses.com;

    # This host exists for exactly one purpose: letting the Windows worker
    # reach dyo-api's loopback-only port. No static files, no directory
    # listing, no other application is reachable through this hostname.
    #
    # Path allowlist, not a catch-all proxy: dyo-api also serves
    # GET /api/workers and GET /api/workers/:workerId (full fleet
    # inventory - names, statuses, capabilities, job IDs) with NO
    # authentication at the application layer today (see the Phase 4 STEP 3
    # security review in docs/AUDIT.md). Those are dashboard-management
    # reads the dashboard already gets via its own internal Next.js proxy
    # straight to 127.0.0.1:4000, loopback-only - the Windows worker itself
    # never calls them (apps/worker/src/infrastructure/api-client.ts only
    # calls POST /api/workers/register and POST /api/workers/:id/heartbeat).
    # They are deliberately NOT proxied here. If a real external consumer of
    # those GET endpoints ever exists, add real authentication to them in
    # apps/api first, then add an explicit location for them - do not widen
    # this to a catch-all `location /` to save effort.
    client_max_body_size 1M;

    location = /api/workers/register {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/workers/[0-9a-fA-F-]+/heartbeat$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket upgrade support reserved for future worker
        # communication - falls through to a normal HTTP proxy when no
        # Upgrade header is sent, which is every heartbeat call today.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $worker_api_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Generous but bounded - a future long-lived/streaming heartbeat
        # connection shouldn't be cut at Nginx's 60s default, but this is
        # still a hard cap, not "forever".
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/worker-api.dyocourses.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/worker-api.dyocourses.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = worker-api.dyocourses.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name worker-api.dyocourses.com;
    return 404; # managed by Certbot
}
